# This container is a read-only public review deployment.
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<Location "/">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</Location>
<LocationMatch "^/admin(?:/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "\.(?:md|ya?ml)$|^(?:Dockerfile|\.dockerignore)$">
    Require all denied
</FilesMatch>

