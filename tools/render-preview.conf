# This container is a read-only public review deployment.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<Directory /var/www/html>
    AllowOverride All
    Require all granted
    # Keep method restrictions in Directory scope: a catch-all Location would
    # override FilesMatch authorization and accidentally expose internal files.
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</Directory>
<LocationMatch "^/admin(?:/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "\.(?:md|ya?ml)$|^(?:Dockerfile|\.dockerignore)$">
    Require all denied
</FilesMatch>

