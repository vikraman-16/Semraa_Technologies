# This container is a read-only public review deployment.
<Directory /var/www/html>
    AllowOverride All
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [F,L]
</Directory>
<LocationMatch "^/admin(?:/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "\.(?:md|ya?ml)$|^(?:Dockerfile|\.dockerignore)$">
    Require all denied
</FilesMatch>

